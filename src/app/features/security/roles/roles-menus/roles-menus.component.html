<p-dialog [(visible)]="isActionView" [style]="{'width': '910px', 'max-height': '50rem'}" header="Configuración de accesos del perfil ADMIN" [modal]="true" class="p-fluid">
    <ng-template pTemplate="header">
        <div class="flex flex-column">
            <div class="p-dialog-title">Configuración de accesos para el perfil {{role?.name}}</div>
            <div class="mt-2 text-blue-600">Asignar y gestionar los menús con sus permisos</div>
        </div>
    </ng-template>
    <ng-template pTemplate="content">
    <div class="flex justify-content-between p-0">
        <div class="col-5">
            <h5 class="mb-3">Menús</h5>
            <p-treeTable [value]="menuTable" [scrollable]="true" [tableStyle]="{'min-width':'10rem'}" [(selection)]="selectedMenu"
            selectionMode="single" (onNodeSelect)="onSelectedMenu($event)" dataKey="id">
                <ng-template pTemplate="header">
                    <tr>
                        <th class="bg-blue-600 text-white" style="width: 10rem;" >Nombre</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-rowNode let-rowData="rowData">
                    <tr [ttRow]="rowNode" [ttSelectableRow]="rowNode">
                        <td style="width: 10rem;">
                            <p-treeTableToggler [rowNode]="rowNode" />
                            <div class="inline-flex align-items-center vertical-align-middle">
                                @if (rowData?.icon) {
                                    <ng-icon [name]="rowData?.icon" class="mr-2 text-xl text-primary-700"></ng-icon>
                                }
                                <div>{{ rowData?.label }}</div>
                            </div>
                        </td>
                    </tr>
                </ng-template>
            </p-treeTable>
        </div>
        <div class="col-5">
            <h5 class="mb-3">Permisos</h5>
            <p-table [value]="permissionsTable" styleClass="p-datatable-gridlines"  [tableStyle]="{ 'max-width': '20rem' }" 
            dataKey="permissionId">
                <ng-template pTemplate="header">
                    <tr>
                        <th class="bg-blue-600 text-center text-white" style="width: 8rem">Permiso</th>
                        <th class="bg-blue-600 text-center text-white" style="width: 1rem">Activo</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-row>
                    <tr>
                        <td class="text-center">{{ row.name | permissionsLabel}}</td>
                        <td class="text-center"><p-inputSwitch [(ngModel)]="row.isActive"/></td>
                    </tr>
                </ng-template>
            </p-table>
            <div class="flex justify-content-end mt-3 w-20" >
                <button pButton pRipple label="Guardar" class="text-white" style="width: 90px;" (click)="save()"></button>
            </div> 
        </div>
 
    </div>
  
</ng-template>

</p-dialog>
