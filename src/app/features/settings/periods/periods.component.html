<div class="card">
    <p-toolbar>
        <div>
            <button pButton pRipple label="Nuevo"  icon="pi pi-plus" class="text-white font-bold"></button>
        </div>
    </p-toolbar>
    <p-table #tablePeriods [value]="periodList" [tableStyle]="{ 'min-width': '60rem' }" [scrollable]="true"  
            dataKey="id" class="p-datatable-sm" [(selection)]="selectedPeriod" [loading]="isLoadingPeriods" loadingIcon="null"> 

        <ng-template pTemplate="header">
            <tr>
                <th id="col1" style="width: 3.5rem" pFrozenColumn alignFrozen="left">
                    <p-tableHeaderCheckbox /></th>
                <th id="col2" style="width: 20rem;">Nombre</th>
                <th id="col3" style="width: 14rem;">Fecha Inicio</th>
                <th id="col4" style="width: 14rem;">Fecha Fin</th>
                <th id="col5" style="width: 10rem;">Estado</th>
                <th id="col7" style="width: 9rem;" pFrozenColumn alignFrozen="right">Opciones</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-item let-index="rowIndex">
            <tr [pSelectableRow]="item">
                <td pFrozenColumn alignFrozen="left">
                    <p-tableCheckbox [value]="item" />
                </td>
                <td>{{ item.name }}</td>
                <td>{{ item.yearStart }}</td>
                <td>{{ item.yearEnd }}</td>
                <td><p-tag [severity]="item.state | tagSevetity" [value]="item.state | periodoTag" [style]="{'font-size': '0.9rem'}"/></td>
                <td pFrozenColumn alignFrozen="right">
                    <button pButton pRipple type="button" [rounded]="true"  severity="info" pTooltip="Editar" (click)="openEdit($event, item)" icon="pi pi-eye" class="mr-2 text-xs font-bold"></button>
                    <button pButton pRipple type="button" [rounded]="true"  severity="warning" pTooltip="Editar" (click)="openEdit($event, item)" icon="pi pi-pencil" class="mr-2  text-xs font-bold"></button>
                    <button pButton pRipple type="button" [rounded]="true"  severity="danger" pTooltip="Eliminar" (click)="openEdit($event, item)" icon="pi pi-trash" class="mr-2 text-xs"></button>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="7" class="w-full">
                    <div class="text-red-500">
                        ... No hay Periodos disponibles
                    </div>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="loadingbody">
            <tr>
                <td colspan="7" class="w-full">
                    <div class="flex flex-column justify-content-center align-items-center p-m-3 w-full">
                        <p-progressSpinner styleClass="p-mb-2"/>
                        <p class="p-text-secondary p-mt-2">Cargando datos, por favor espere...</p>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table> 
</div>
