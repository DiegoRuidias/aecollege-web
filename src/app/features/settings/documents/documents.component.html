<div class="card p-2 md:p-4">
    <p-toolbar>
        <h5 class="mt-3">Documentación del Estudiante</h5>
        <div>
            <button pButton pRipple label="Nuevo"  icon="pi pi-plus" class="text-white font-bold" (click)="openNew()"></button>
        </div>
    </p-toolbar>
    <p-table #tableDocuments [value]="documentList" [tableStyle]="{ 'min-width': '60rem' }" [scrollable]="true"  
            dataKey="id" class="p-datatable-sm" [(selection)]="selectedDocument" [loading]="isLoadingDocument" loadingIcon="null"> 

        <ng-template pTemplate="header">
            <tr>
                <th id="col1" style="width: 3.5rem" pFrozenColumn alignFrozen="left">
                    <p-tableHeaderCheckbox /></th>
                <th id="col2" style="width: 20rem;">Documento</th>
                <th id="col3" style="width: 14rem;" class="text-center">Requerido</th>
                <th id="col7" style="width: 9rem;" pFrozenColumn alignFrozen="right">Opciones</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-item let-index="rowIndex">
            <tr [pSelectableRow]="item">
                <td pFrozenColumn alignFrozen="left">
                    <p-tableCheckbox [value]="item" />
                </td>
                <td>{{ item.name }}</td>
                <td class="text-center"><p-checkbox [binary]="true" readonly="true" [ngModel]="item.required" /></td>
                <td pFrozenColumn alignFrozen="right">
                    <button pButton pRipple type="button" [rounded]="true"  severity="danger" pTooltip="Eliminar" icon="pi pi-trash" class="mr-2 text-xs"></button>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="7" class="w-full">
                    <div class="text-red-500">
                        ... No hay Documentos
                    </div>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="loadingbody">
            <tr>
                <td colspan="7" class="w-full">
                    <div class="flex flex-column justify-content-center align-items-center p-m-3 w-full">
                        <p-progressSpinner styleClass="p-mb-2"/>
                        <p class="p-text-secondary p-mt-2">Cargando datos, por favor espere...</p>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>    
</div>

<p-dialog [modal]="true" [(visible)]="isFormDocuments" [resizable]="false" [style]="{ width: '35rem' }">
    <ng-template pTemplate="header">
        <div class="flex flex-column">
            <div class="p-dialog-title">Crear Documentación de matrícula</div>
            <div class="mt-2 text-blue-600">Ingrese los campos solicitados</div>
        </div>
    </ng-template>
    <form [formGroup]="formDocument">
        <div class="field">
            <label for="name" class="font-semibold">Nombre</label>
            <p-inputGroup>
                <p-inputGroupAddon>
                    <ng-icon name="matFolder" class="text-color text-lg"></ng-icon>
                </p-inputGroupAddon>
                <input pInputText id="name" formControlName="name" [maxLength]="50" class="w-full"
                [ngClass]="{'ng-invalid ng-dirty': hasError('name', 'required')}"/>                
            </p-inputGroup>
            @if (hasError('name', 'required')) {
                <div class="p-error ml-6">Por favor ingrese el nombre del Documento</div>
            }  
        </div>
        <div class="field flex flex-column">
            <label for="name" class="font-semibold">Requerido</label>
            <p-inputSwitch formControlName="required" />             
        </div>
    </form>
    <div class="flex justify-content-end gap-2">
        <button pButton pRipple type="button"  severity="info" pTooltip="Cancelar" (click)="isFormDocuments = false" class="font-semibold">Cancelar</button>
        <button pButton pRipple type="button" [loading]="isLoadingButton" severity="success" pTooltip="Guardar" (click)="save()"  class="font-semibold">Guardar</button>
    </div>
</p-dialog>
