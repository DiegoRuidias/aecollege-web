<div class="card p-2 md:p-4">
    <p-toolbar>
        <h4 class="mt-3 text-primary">Pagos Registrados</h4>
        <div class="flex flex-row align-items-center">
            <p-checkbox class="mr-3 " [(ngModel)]="isAllPays" binary="true" />
            <div class="flex align-items-center">
                <label for="yearEnd" class="font-semibold mr-2">Fecha</label>
                <p-calendar dateFormat="dd/mm/yy"  [(ngModel)]="datePays" [readonlyInput]="isAllPays" inputId="Eliga la fecha" appendTo="body" [iconDisplay]="'input'" 
                    [showOnFocus]="false" [showIcon]="!isAllPays"/>
            </div>
            <button pButton icon="pi pi-search" (click)="onSearch()" class="ml-2"></button>
        </div>
    </p-toolbar>
    <p-table #tablePayments [value]="paysList" [tableStyle]="{ 'min-width': '50rem' }" [scrollable]="true"
            dataKey="id" class="p-datatable-sm" [(selection)]="selectedPays" [loading]="isLoading"
            loadingIcon="null" [rows]="10" [paginator]="true" [rowsPerPageOptions]="[5, 10, 20]">

        <ng-template pTemplate="header">
            <tr>
                <th id="col1" style="width: 3.5rem" pFrozenColumn alignFrozen="left">
                    <p-tableHeaderCheckbox /></th>
                    <th id="col3" style="width: 9rem;">Usuario</th>
                <th id="col1" style="width: 20rem;">Cuenta</th>
                <th id="col2" style="width: 8rem;">Monto</th>
                <th id="col5" style="width: 8rem;" class="text-center" style="width: 9rem;">Medio de Pago</th>
                <th id="col5" style="width: 15rem;" class="text-center">Fecha</th>
                <th id="col6" style="width: 5rem;" pFrozenColumn alignFrozen="right">Opciones</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-item let-index="rowIndex">
            <tr [pSelectableRow]="item">
                <td pFrozenColumn alignFrozen="left">
                    <p-tableCheckbox [value]="item" />
                </td>
                <td class="font-bold">{{ item.user}}</td>
                <td class="font-semibold">{{ item.account }}</td>
                <td class="font-semibold">S/. {{ item.total }}</td>
                <td class="text-center">{{ item.halfPayment | labelHalf }}</td>
                <td class="text-center">{{ item.date | date:'medium' }}</td>
                <td pFrozenColumn alignFrozen="right" >
                    <button pButton pRipple type="button" [rounded]="true"  severity="help" pTooltip="ver" icon="pi pi-eye" class="mr-2 text-xs font-bold"></button>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="7" class="w-full">
                    <div class="text-red-500">
                        ... No hay Pagos disponibles
                    </div>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="loadingbody">
            <tr>
                <td colspan="5" class="w-full">
                    <div class="flex flex-column justify-content-center align-items-center p-m-3 w-full">
                        <p-progressSpinner styleClass="p-mb-2"/>
                        <p class="p-text-secondary p-mt-2">Cargando datos, por favor espere...</p>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
