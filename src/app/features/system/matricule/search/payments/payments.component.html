<div class="grid">
    @for (item of charges; track $index) {
    <div class="col-12 sm:col-6 md:col-4">
        <div class="card surface-50 p-3 cursor-pointer student-card" (click)="appPays.viewComponent()">
            <h5 class="text-primary font-bold">{{item.charge}}</h5>
            <div class="text-lg">Monto: S/. {{item.amount}}</div>
            <div class="text-lg mb-3">Vencimiento: {{item.expiry}}</div>
            <p-tag [severity]="item.state | state" [value]="item.state | labelCharge" [style]="{'font-size': '1.1rem'}"/>
        </div>
    </div>
    }
    <div class="col-12">
        <p-table [value]="historial" class="p-datatable-sm" [tableStyle]="{ 'min-width': '100%' }">
            <ng-template pTemplate="header">
                <tr>
                    <th>Fecha</th>
                    <th>Concepto</th>
                    <th>Monto</th>
                    <th>Estado</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-product>
                <tr>
                    <td>{{ product.code }}</td>
                    <td>{{ product.name }}</td>
                    <td>{{ product.category }}</td>
                    <td>{{ product.quantity }}</td>
                </tr>
            </ng-template>
        </p-table>
    </div>

</div>
<app-pays #appPays [pays]="pays" (load)="refreshPage()" [person]="person" [fileEconomic]="fileEconomic"></app-pays>
